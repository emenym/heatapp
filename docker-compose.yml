version: '3.8'

services:
    mongodb:
        image: mongo:4.4.13
        container_name: mongodb
        restart: always
        ports:
            - "27017:27017"
        volumes:
            - ./data:/data/db

        command: mongod --auth

    reborn-api:
        image: python:3.11-slim
        container_name: heatapp-reborn-api
        working_dir: /app
        restart: unless-stopped
        ports:
            - "8081:8081"
        volumes:
            - ./:/app
            - ./reborn_data:/app/reborn_data
        environment:
            - REBORN_PORT=8081
            - REBORN_DB_PATH=/app/reborn_data/heat_reborn.sqlite3
            - REBORN_ZONE_SEED=/app/zones.json
            - PYTHONUNBUFFERED=1
        command: sh -c "pip install -r requirements.txt && python -m reborn.app"

    reborn-poller:
        image: python:3.11-slim
        container_name: heatapp-reborn-poller
        working_dir: /app
        restart: unless-stopped
        depends_on:
            - reborn-api
        volumes:
            - ./:/app
            - ./reborn_data:/app/reborn_data
        environment:
            - REBORN_DB_PATH=/app/reborn_data/heat_reborn.sqlite3
            - REBORN_ZONE_SEED=/app/zones.json
            - PYTHONUNBUFFERED=1
        command: sh -c "pip install -r requirements.txt && python -m reborn.run_poller"

    reborn-frontend:
        image: node:20-alpine
        container_name: heatapp-reborn-frontend
        working_dir: /app/reborn_ui
        restart: unless-stopped
        depends_on:
            - reborn-api
        ports:
            - "5173:5173"
        volumes:
            - ./:/app
            - /app/reborn_ui/node_modules
        environment:
            - VITE_PROXY_TARGET=http://reborn-api:8081
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"